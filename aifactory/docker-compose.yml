services:
  # =============================================
  # MetaGPT — PM / Architect / Code Generation
  # Provider: OpenCode Go
  # Model: DeepSeek V4 Pro
  # =============================================
  metagpt:
    build:
      context: .
      dockerfile: docker/metagpt/Dockerfile
    container_name: aifactory-metagpt
    hostname: metagpt
    volumes:
      - workspace-data:/workspace
      - metagpt-cache:/root/.cache
      - ./config/metagpt:/config
    networks:
      - aifactory-net
    environment:
      - METAGPT_LLM_API_KEY=${OPENCODE_GO_KEY}
      - METAGPT_LLM_MODEL=${METAGPT_MODEL:-deepseek-v4-pro}
      - METAGPT_LLM_BASE_URL=${METAGPT_BASE_URL:-https://opencode.ai/zen/go/v1}
    restart: unless-stopped

  # =============================================
  # OpenCode — AI Coding Agent (코드 수정/리뷰/테스트)
  # Provider: OpenCode Go
  # Web UI: http://localhost:4096
  # =============================================
  opencode:
    build:
      context: .
      dockerfile: docker/opencode/Dockerfile
    container_name: aifactory-opencode
    hostname: opencode
    ports:
      - "4096:4096"
    volumes:
      - workspace-data:/workspace
      - opencode-data:/root/.local/share/opencode
    networks:
      - aifactory-net
    environment:
      - OPENCODE_GO_KEY=${OPENCODE_GO_KEY}
      - PORT=4096
    restart: unless-stopped

volumes:
  workspace-data:
  metagpt-cache:
  opencode-data:

networks:
  aifactory-net:
    driver: bridge
